<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowthKarao | Under Development</title>
  <link rel="icon" type="image/svg+xml" href="growthkarao-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .background-glow {
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      filter: blur(100px);
    }
    .content {
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 800px;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #f8fafc, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeInDown 1s ease-out forwards;
    }
    p {
      font-size: 1.25rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      animation: fadeInUp 1s ease-out 0.3s forwards;
      opacity: 0;
    }
    .loader {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite, fadeIn 1s ease-out 0.6s forwards;
      opacity: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .social-links {
      margin-top: 3rem;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.9s forwards;
    }
    .social-links a {
      color: var(--text-color);
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }
    .social-links a:hover {
      color: var(--accent);
    }

    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      p { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>
  <div class="content">
    <h1>Under Development</h1>
    <p>We're currently brewing up something extraordinary. GrowthKarao will be back online shortly with a completely revamped experience.</p>
    <div class="loader"></div>
    <div class="social-links">
      <a href="https://instagram.com/growthkarao" target="_blank">Instagram</a>
      <a href="mailto:hello@growthkarao.com">Contact Us</a>
    </div>
  </div>
</body>
</html>
